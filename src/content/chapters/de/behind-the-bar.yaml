body:
  - Im Appenzeller Huus begann ich als Praktikant Bar & Lounges, in einem Fünf-Sterne-Haus, das zu The Leading Hotels of the World gehört und nach LQA-Standards arbeitet. Heute stehe ich dort an den Wochenenden in Teilzeit hinter der Bar.
  - Verantwortung wurde mir schnell übertragen, etwa bei der Mitorganisation von Events. Daran ist mein Gästekontakt gewachsen, von eher zurückhaltend zu authentisch und selbstsicher.
  - "Am meisten fasziniert mich, Neues zu lernen, weit über klassisches Bartending hinaus: mit Rotationsverdampfer, Zentrifuge und Ultraschall-Homogenisator zu arbeiten und zu verstehen, wofür sie da sind."
