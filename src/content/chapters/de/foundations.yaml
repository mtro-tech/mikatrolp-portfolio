order: 3
stage: Fundament
heading: Leutnant, Schweizer Infanterie
organisation:
  name: Schweizer Armee
body:
  - "Als Leutnant der Schweizer Infanterie habe ich 60 Personen geführt und ausgebildet. Dabei habe ich gelernt: Wer mit Integrität und Fairness vorangeht, schafft Respekt, der auf beiden Seiten verdient ist. Diese Arbeitshaltung nehme ich in die Hotellerie mit, für das Ergebnis und für die Menschen, die ich führe."
