body:
  - Als Nächstes gehe ich als Praktikant Guest Relations ins Rosewood Hong Kong. Ich möchte den Massstab der Hotellerie erleben, und ich sehe dafür keinen besseren Ort.
  - "Dort will ich die Kunst von Rooms Division und Guest Relations lernen: verstehen, was Gäste während ihres ganzen Aufenthalts brauchen, und sie dabei unterstützen."
