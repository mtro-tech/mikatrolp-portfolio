body:
  - I joined Appenzeller Huus as Intern Bar & Lounges, in a five-star house that is a member of The Leading Hotels of the World and works to LQA standards. Today I tend bar there part-time at weekends.
  - Responsibility was handed to me quickly, such as co-organising events. That is how my guest contact grew, from rather reserved to authentic and confident.
  - "What fascinates me most is learning the new, well beyond classic bartending: working with a rotary evaporator, a centrifuge and an ultrasonic homogeniser, and understanding what each is for."
