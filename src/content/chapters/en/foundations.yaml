order: 3
stage: Foundations
heading: Lieutenant, Swiss Infantry
organisation:
  name: Swiss Armed Forces
body:
  - "As a lieutenant in the Swiss Infantry, I led and trained 60 people. It taught me that leading by example, with integrity and fairness, creates respect that is earned both ways. I carry that work ethic into hospitality, for the result and for the people I lead."
